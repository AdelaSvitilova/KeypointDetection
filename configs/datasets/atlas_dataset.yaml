dataset:
  name: atlas  # Dataset identifier (e.g., 'atlas')
  train: "train.csv"  # Training split file; uncomment for fold-specific: "train_atlas_vertebra_fold_0.csv"
  train_num_samples: 10  # Override training sample count; null uses full dataset
  val: "val.csv"  # Validation split file; uncomment for fold-specific: "val_atlas_vertebra_fold_0.csv"
  val_num_samples: 2  # Override validation sample count; null uses full dataset
  params:
    root_dir: "./data/atlas_full"  # Base directory for dataset files
    num_keypoints: 23  # Number of keypoints per annotation
    annotation_file: pose_dataset.csv  # File containing keypoint annotations
    norm_coefficient: 10  # Normalization factor for metrics like PCK (scales to object size)
  augmentation:
    flip:
      use: True
      probability: 0.5

    clahe:
      use: True
      clip_min: 2
      clip_max: 3
      tile_grid_min: 8
      tile_grid_max: 8
      probability: 0.5

    brightness:
      use: True
      brightness_min: -0.2
      brightness_max: 0.1
      contrast_min: -0.2
      contrast_max: 0.2
      probability: 0.5

    rotate:
      use: True 
      min: -7
      max: 7
      probability: 0.5

    translate:
      use: True
      translate_percent_from: -0.05
      translate_percent_to: 0.05
      probability: 0.5
    