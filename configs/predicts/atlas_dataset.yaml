# experiment:
#   name: exp_to_test  # Experiment identifier/name

predict:
  name: atlas  # Prediction task/dataset name
  model: epoch_500.pt  # Model checkpoint; use null for best or specify epoch_X.pt
  images_list: "val.csv"  # Image list file; uncomment for fold: "val_atlas_vertebra_fold_0.csv"
  num_samples: 100  # Number of samples to predict (overrides full list); null uses full dataset
  prefix: val  # Output prefix for prediction files
  num_select_images: 12
  batch_size: 2  # Inference batch size
  annotation_label: annotation_label.txt  # File mapping keypoint names/indices
  metrics: ["PCK_heatmaps", "AED_heatmaps"]  # Heatmap-based metrics to compute
  kp_metrics: ["PCK", "AED"]  # Keypoint-level metrics to compute
  params:
    root_dir: "./data/atlas_full"  # Dataset root directory
    annotation_file: pose_dataset.csv  # Keypoint annotation file
    input_size:
      - 256  # Input height
      - 256  # Input width