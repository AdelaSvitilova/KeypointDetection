predict:
  name: atlas  # Prediction task/dataset name
  model: final.pt  # Model checkpoint; use null for best or specify epoch_X.pt
  images_list: "val.csv"  # Image list file; uncomment for fold: "val_atlas_vertebra_fold_0.csv"
  num_samples: null  # Number of samples to predict (overrides full list); null uses full dataset
  prefix: val  # Output prefix for prediction files
  num_select_images: 100
  batch_size: 1  # Inference batch size
  predict_images: true
  select_images: true
  save_predictions: true
  annotation_label: annotation_label.txt  # File mapping keypoint names/indices
  sorting_metrics:
    metrics: [PCK, AED, cobb_angle]
    directions: ["+", "-", "+"]
  per_image_metrics: [AED, PCK, cobb_angle]
  per_keypoint_metrics: [AED, PCK]
  global_metrics: [AED, PCK, cobb_angle] 